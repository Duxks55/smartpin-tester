name: Build SmartPin Binary

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller adafruit-circuitpython-ads1x15

      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --noconsole --collect-all adafruit_ads1x15 --collect-data board smartpin_master.py
          cd dist/smartpin_master && zip -r ../../smartpin_master_linux_arm.zip *

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: smartpin_master_linux_arm.zip
          fail_on_unmatched_files: true
          body: "Automated kiosk binary build for SmartPin Master."
          <b>overwrite: true</b>
